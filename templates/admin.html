<!DOCTYPE html>
<html>
<head>
    <title>Panel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>⚙️ Panel de Administración</h2>

        <div>
            <span class="me-3">
                👤 <strong>{{ session.usuario }}</strong> ({{ session.rol }})
            </span>

            <a href="/" class="btn btn-outline-primary btn-sm">Inicio</a>
            <a href="/logout" class="btn btn-danger btn-sm">Salir</a>
        </div>
    </div>

    <!-- Crear usuario -->
    <div class="card mb-4">
        <div class="card-header bg-dark text-white">
            ➕ Crear nuevo usuario
        </div>

        <div class="card-body">
            <form method="POST" action="/crear_usuario" class="row g-3">

                <div class="col-md-4">
                    <input type="text" name="usuario" class="form-control" placeholder="Usuario" required>
                </div>

                <div class="col-md-4">
                    <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
                </div>

                <div class="col-md-2">
                    <select name="rol" class="form-select">
                        <option value="admin">Admin</option>
                        <option value="tecnico">Técnico</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Crear</button>
                </div>

            </form>
        </div>
    </div>

    <!-- Lista de usuarios -->
    <div class="card">
        <div class="card-header bg-secondary text-white">
            👥 Usuarios registrados
        </div>

        <div class="card-body">

            <table class="table table-hover table-bordered text-center">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Rol</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody>
                {% for u in usuarios %}
                    <tr>
                        <td>{{ u[0] }}</td>
                        <td>{{ u[1] }}</td>
                        <td>
                            {% if u[2] == "admin" %}
                                <span class="badge bg-danger">Admin</span>
                            {% else %}
                                <span class="badge bg-primary">Técnico</span>
                            {% endif %}
                        </td>

                        <td>
                            <a href="/eliminar_usuario/{{ u[0] }}" 
                               class="btn btn-outline-danger btn-sm"
                               onclick="return confirm('¿Eliminar usuario?')">
                                ❌ Eliminar
                            </a>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
